name: Check code
on:
  push:
    branches:
     - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer ] # ${{matrix.service}}
        python-vercion: [3.12, 3.11, 3.8] 


    steps:
    - name: actions/checkout@v6
      uses: actions/checkout@v6
      uses: actions/setup-python@v7
      with:
        python-version: ${{matrix.python-ver }}
    - run: pip install -r services/${{matrix.service}}/requirements.txt
    - run: pytest services/${{matrix.service}}

