name: Check code
on:
  push:
    branches:
     - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: actions/checkout@v6
      uses: actions/checkout@v6
      with:
        python-version: "3.12"
    - run: pip install -r services/tasks-api/requirements.txt
    - run: pytest servces/tasks-api

